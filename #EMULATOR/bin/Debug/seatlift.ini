## Seat lift overrides for the Nitro client (WebSocketConnectionHandler)
##
## A seated/lying avatar is rendered by the Nitro client at:  packetZ + <this value>
## So this number is the seat surface height ABOVE the furniture's base tile, in tiles.
## Too low  -> avatar sinks into the cushion / mattress.
## Too high -> avatar floats above the furniture.
##
## Syntax:  <base item id>=<lift in tiles>
## Only the items listed here use their own value; everything else falls back to
## SeatLiftChairFactor / SeatLiftBedFactor in WebSocketConnectionHandler.cs.
##
## Existing entries:
##    906 = pura_mdl4*6  "Blue Corner Module"   (1.0 tall)
##    952 = bed_budget*6 "Blue Double Bed"       (1.9 tall)

906=0.71
952=0.74